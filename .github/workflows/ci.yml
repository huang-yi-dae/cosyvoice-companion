name: CI

# Lint + pure-logic tests. Deliberately lightweight: the pure-logic test suite
# only needs PyYAML / python-dotenv, so heavy runtime deps (torch, soundfile,
# dashscope, ...) are NOT installed here and no GPU/network is required.

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint & test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff PyYAML python-dotenv

      - name: Lint (ruff)
        # pyproject excludes the vendored internal/src/CosyVoice tree.
        run: ruff check .

      - name: Run tests (pytest)
        run: pytest
